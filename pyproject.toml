[project]
name = "interview-prep-qna"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aamit2267", email = "aamit2267@gmail.com" }
]
requires-python = ">=3.12, <3.14"
dependencies = [
    "alembic>=1.19.1",
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.57.0",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "notion-client>=3.1.0",
    "pgvector>=0.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pygithub>=2.10.0",
    "pymongo>=4.17.0",
    "sqlalchemy>=2.0.52",
    "tavily>=1.1.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.4",
]

[project.scripts]
interview-prep-qna = "interview_prep_qna:main"
api = "interview_prep_qna:run_api"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
markers = [
    "integration: calls a real external service and requires credentials",
]

[tool.ruff.lint]
extend-ignore = ["BLE001"]
